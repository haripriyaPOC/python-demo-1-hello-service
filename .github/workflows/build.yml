name: Python Application Build and Kubernetes Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: [self-hosted, Linux, X64]

    steps:

      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4


      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Python Virtual Environment
        run: |
          python3.12 -m venv .venv

      - name: Install Dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Run Tests
        run: |
          .venv/bin/python -m pip install pytest
          .venv/bin/python -m pytest

      # Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/python1-backend:v1 .

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/python1-backend:v1

      # Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/python-backend \
            python-backend=${{ secrets.DOCKER_USERNAME }}/python1-backend:v1

      # Verify Deployment
      - name: Verify Kubernetes Deployment
        run: |
          kubectl rollout status deployment/python1-backend --timeout=180s
